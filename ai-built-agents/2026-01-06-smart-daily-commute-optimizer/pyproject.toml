[tool.poetry]
name = "smart-commute-optimizer"
version = "0.1.0"
description = "An agent to optimize daily commutes by predicting optimal routes and estimating travel times based on real-time traffic data."
authors = ["Agent Foundry <agent@foundry.ai>"]

[tool.poetry.dependencies]
python = "^3.8"
pydantic = "^2.9.0"
langgraph = "^0.2.0"
langchain-openai = "^0.2.0"
python-dotenv = "^1.2.1"
requests = "^2.31.0"
geopy = "^2.3.0"
flask = "^2.3.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
