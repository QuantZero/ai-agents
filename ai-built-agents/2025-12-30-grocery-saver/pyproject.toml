[tool.poetry]
name = "grocery-saver"
version = "0.1.0"
description = "An AI agent to optimize grocery shopping and reduce waste."
authors = ["Agent Foundry"]

[tool.poetry.dependencies]
python = "^3.8"
pydantic = ">=2.9.0"
