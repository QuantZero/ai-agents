[tool.poetry]
name = "home-energy-optimizer"
version = "0.1.0"
description = "An agent that optimizes home energy usage to reduce costs and environmental impact."
authors = ["Agent Foundry"]

[tool.poetry.dependencies]
python = "^3.8"
pydantic = "^2.9.0"
langgraph = "^0.2.0"
langchain-openai = "^0.2.0"
python-dotenv = "^1.2.1"
openai = "^0.2.0"
home-assistant-api = "^1.0.0"
numpy = "^1.21.0"
pandas = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
